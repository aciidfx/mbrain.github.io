<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Work Brain">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Work Brain</title>
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bd2:#cbd5e1;--teal:#0f766e;--tealbg:#f0fdfa;--bg:#f8fafc;--card:#fff;--hdr:#fffe;--tx:#334155;--red:#dc2626;--warnbg:#fffbeb;--warntx:#78350f;--redbg:#fef2f2;--redtx:#7f1d1d;--outtx:#134e4a;--ic:#0f172a}
html[data-theme=dark]{color-scheme:dark;--ink:#f1f5f9;--mut:#94a3b8;--line:#263244;--bd2:#475569;--teal:#0d9488;--tealbg:#0f2f2f;--bg:#0b1220;--card:#111a2b;--hdr:#111a2bee;--tx:#cbd5e1;--warnbg:#3a2a0a;--warntx:#fcd34d;--redbg:#3b1212;--redtx:#fca5a5;--outtx:#99f6e4;--ic:#1e293b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:.9375rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,p{margin:0}h1{font-size:1.5rem;color:var(--ink)}h2{font-size:1.125rem;color:var(--ink)}h3{font-size:.9375rem;color:var(--ink)}
button{font:inherit;cursor:pointer;color:inherit}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:1000px;margin:auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{display:flex;gap:10px;align-items:center;background:none;border:0;padding:0;font-weight:600;color:var(--ink)}
.logo{background:var(--teal);color:#fff;border-radius:10px;padding:7px;display:flex}
.sw{position:relative;margin-left:auto;flex:1 1 220px;max-width:340px}
input,textarea,select{font:inherit;width:100%;border:1px solid var(--bd2);border-radius:8px;padding:8px 10px;background:var(--card);color:var(--ink)}
input:focus,textarea:focus{outline:2px solid #0f766e33;border-color:var(--teal)}
#res{position:absolute;top:44px;right:0;width:min(26rem,calc(100vw - 32px));max-height:320px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #0002;padding:6px;display:none}
#res button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px}
#res button:hover{background:var(--bg)}
small,.mut{color:var(--mut);font-size:.75rem}
main{max-width:1000px;margin:auto;padding:24px 16px 90px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:#115e59}.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--bd2)}.btn.ghost:hover{background:var(--bg)}
.btn.red{background:var(--red)}.btn.sm{padding:6px 10px;font-size:13px}.btn.danger{background:var(--card);color:var(--red);border:1px solid var(--bd2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.end{justify-content:flex-end}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;border-radius:6px;padding:5px 12px;font-weight:500;color:var(--mut)}.seg .on{background:var(--teal);color:#fff}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px}
.card:hover{border-color:#0f766e88;box-shadow:0 4px 14px #0001}
.cm{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:14px 48px 14px 14px}
.tile{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--c,var(--teal)) 14%,var(--card));color:var(--c,var(--teal));display:flex;align-items:center;justify-content:center;flex:none}
.x{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:none;color:#94a3b8;display:flex;align-items:center;justify-content:center}
.x:hover{background:var(--redbg);color:var(--red)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:14px;font-size:14px}
.crumbs button{background:none;border:0;padding:0;color:var(--mut)}.crumbs button:hover{color:var(--teal)}.crumbs .cur{color:var(--ink);font-weight:600}
section{margin-top:32px}.empty{border:1px dashed var(--bd2);border-radius:16px;padding:28px;text-align:center;color:var(--mut)}
.warn{background:var(--warnbg);color:var(--warntx);border-radius:12px;padding:12px 14px;font-size:12px;margin:10px 0 14px}
.note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.out{background:var(--tealbg);color:var(--outtx);border-radius:12px;padding:10px 12px;margin-top:10px;white-space:pre-wrap}
label{display:block;font-weight:500;font-size:14px;margin-bottom:12px}label input,label textarea,label select{margin-top:4px;font-weight:400}
.pre{white-space:pre-wrap}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.th{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg);padding:0;display:block}
.th img{width:100%;height:100%;object-fit:cover;display:block}
button.th{cursor:zoom-in}
.th .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:#0f172acc;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.th.add{border:1px dashed #94a3b8;color:var(--mut);font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.th.add:hover{border-color:var(--teal);color:var(--teal)}
/* radial map */
.map{position:relative;aspect-ratio:1;max-width:740px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.map svg.l{position:absolute;inset:0;width:100%;height:100%;stroke-width:.5}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 8px var(--tealbg),0 8px 20px #0f766e44;font-size:clamp(12px,2.6vw,19px)}
.nd{position:absolute;transform:translate(-50%,-50%)}
.nd>button.o{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.ic{position:relative;width:clamp(48px,11vw,80px);aspect-ratio:1;border-radius:50%;background:var(--c,var(--ic));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--card),0 4px 10px #0003;transition:transform .15s,background .15s}
.nd:hover .ic{transform:scale(1.1);filter:brightness(1.2)}
.lb{background:var(--card);border-radius:99px;padding:1px 10px;font-size:clamp(11px,1.6vw,14px);font-weight:600;color:var(--ink);box-shadow:0 0 0 1px var(--line);max-width:130px;line-height:1.3}
.bd{position:absolute;left:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:#f59e0b;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--card)}
.nd .x{top:0;right:-6px;transform:none;width:24px;height:24px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
@media(hover:hover){.nd .x{opacity:0}.nd:hover .x,.nd .x:focus{opacity:1}}
/* dialog */
dialog{background:var(--card);color:var(--tx);border:0;border-radius:16px;padding:0;width:min(30rem,calc(100vw - 32px));box-shadow:0 20px 50px #0004}
dialog::backdrop{background:#0f172a66}
dialog form{padding:22px}dialog h2{margin-bottom:14px}
.alert{background:var(--redbg);color:var(--redtx);border-radius:12px;padding:14px;margin-bottom:16px}

input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--teal);flex:none}
.dt{width:auto}
.trow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.trow:last-child{border:0}.trow .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.lnk{flex:1;text-align:left;background:none;border:0;padding:0;color:inherit;min-width:0}
.tag{font-size:.75rem;border-radius:99px;padding:1px 9px;background:var(--bg);color:var(--mut);white-space:nowrap}.tag.od{background:var(--redbg);color:var(--red)}.tag.td{background:var(--warnbg);color:var(--warntx)}
.pinned{color:#f59e0b!important}.pinned svg{fill:#f59e0b}
.fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;border:0;font-size:30px;line-height:1;box-shadow:0 6px 18px #0004;z-index:6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;z-index:20;box-shadow:0 8px 24px #0004;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px)}.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline}
.fold{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:inherit}
.fold svg{transition:transform .15s;color:var(--mut)}.fold[aria-expanded=true] svg{transform:rotate(90deg)}
.nh{display:flex;gap:6px;align-items:flex-start;background:none;border:0;padding:0;text-align:left;flex:1;min-width:0;color:inherit}
.nh>span:last-child{min-width:0;flex:1;display:block}.nh .chv{margin-top:3px;color:var(--mut);transition:transform .15s}.nh[aria-expanded=true] .chv{transform:rotate(90deg)}
.pv{display:block;color:var(--mut);font-size:.8125rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note.c{padding:12px 16px}
.sws{display:flex;gap:8px;flex-wrap:wrap}.sws label{margin:0}.sws input{position:absolute;opacity:0;width:0;height:0;padding:0;border:0;margin:0}
.sws span{display:block;width:28px;height:28px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd2);cursor:pointer}
.sws input:checked+span{box-shadow:0 0 0 2px var(--ink)}.sws input:focus-visible+span{outline:2px solid var(--teal);outline-offset:3px}
.card.over,.nd.over{outline:2px dashed var(--teal);outline-offset:3px}.dragging{opacity:.45}
mark{background:#fde68a;color:#0f172a;border-radius:3px;padding:0 1px}
#res .tag{margin-right:6px}#res .sn{display:block;margin-top:2px}
kbd{border:1px solid var(--bd2);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:inherit;font-size:.8125rem;background:var(--bg);color:var(--ink)}
.kb{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin-bottom:16px;align-items:center}
[hidden]{display:none!important}
a{color:var(--teal);overflow-wrap:anywhere}html[data-theme=dark] a{color:#5eead4}
#alerts{position:fixed;top:70px;right:16px;z-index:30;display:grid;gap:10px;width:min(340px,calc(100vw - 32px))}
.ralert{background:var(--card);color:var(--tx);border:1px solid var(--bd2);border-left:5px solid #f59e0b;border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px #0004;animation:pop .2s}
.ralert .row{margin-top:10px}@keyframes pop{from{transform:translateY(-8px);opacity:0}}
#rem section{margin-top:0}
html{-webkit-text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
header{padding-top:env(safe-area-inset-top)}
button,a,input,select,textarea{touch-action:manipulation}
.menu-btn{display:none}
@media(max-width:640px){
 .hin{padding:8px 12px;gap:8px}.brand{margin-right:auto}
 .sw{order:3;flex:1 1 100%;max-width:none;margin-left:0}
 .menu-btn{display:inline-flex}.tools{display:none;order:4;flex:1 1 100%}.tools.open{display:flex}
 main{padding:16px 12px calc(96px + env(safe-area-inset-bottom))}
 h1{font-size:1.3rem}.grid{grid-template-columns:1fr}
 #alerts{top:8px;left:8px;right:8px;width:auto}
 .fab{right:16px;bottom:calc(16px + env(safe-area-inset-bottom))}
 .toast{bottom:calc(88px + env(safe-area-inset-bottom))}
 .bar{align-items:center}
}
@media(pointer:coarse){
 .btn{min-height:44px}.btn.sm{min-height:40px}
 .x{width:40px;height:40px}.cm{padding-right:56px}
 input[type=checkbox]{width:24px;height:24px}
 input,textarea,select{font-size:16px}
 .trow{padding:12px 0}.seg button{padding:8px 14px}
}
.fab:hover{filter:brightness(1.1)}
@media print{header,.fab,.noprint,.btn,.x,.crumbs,#res{display:none!important}
html[data-theme=dark]{--ink:#0f172a;--mut:#475569;--line:#e2e8f0;--bd2:#cbd5e1;--card:#fff;--bg:#fff;--tx:#1e293b;--tealbg:#f0fdfa;--outtx:#134e4a;--warnbg:#fffbeb;--warntx:#78350f}
body{background:#fff}main{max-width:none;padding:0}.panel,.note,.card{break-inside:avoid}.th{width:140px;height:140px}.fold svg,.nh .chv{display:none}}
</style>
</head>
<body>
<header><div class="hin">
  <button class="brand" data-act="home"><span class="logo" id="logo"></span><span>Work Brain<br><small style="font-weight:400">Admissions &amp; Records</small></span></button>
  <div class="sw"><input id="q" type="search" placeholder="Search everything  ( / )" autocomplete="off"><div id="res"></div></div>
  <button class="btn ghost sm" id="remBtn" data-act="rem" title="Reminders"></button><button class="btn ghost sm menu-btn" data-act="menu" aria-label="More options">More</button><div class="row tools"><button class="btn ghost sm" data-act="help" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">?</button><button class="btn ghost sm" id="themeBtn" data-act="theme"></button><button class="btn ghost sm" data-act="big" title="Larger text" aria-label="Toggle larger text">A+</button><button class="btn ghost sm" id="diskBtn" data-act="disk" hidden></button><button class="btn ghost sm" data-act="export">Export backup</button><button class="btn ghost sm" data-act="import">Import</button></div>
</div></header>
<main id="app"></main>
<button class="fab noprint" data-act="capture" aria-label="Quick capture" title="Quick capture (n)">+</button>
<div id="alerts" class="noprint" aria-live="assertive"></div>
<dialog id="dlg"></dialog>
<input type="file" id="file" accept=".json,application/json" hidden>
<input type="file" id="imgs" accept="image/*" multiple hidden>

<script>
const KEY="work-brain-v1";
const P={share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',bell:'<path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 004 0"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',print:'<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/>',reset:'<path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8M3 3v5h5"/>',pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0116 0z"/><circle cx="12" cy="10" r="3"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 21v-1a6 6 0 0112 0v1M17 4.5a3.5 3.5 0 010 7M22 21v-1a6 6 0 00-4-5.6"/>',
file:'<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9zM14 3v6h6M8 13h8M8 17h8"/>',
archive:'<rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v11a2 2 0 002 2h10a2 2 0 002-2V8M10 12h4"/>',
cap:'<path d="M22 10L12 5 2 10l10 5zM6 12v5c3 2 9 2 12 0v-5"/>',
folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
scale:'<path d="M12 3v18M5 21h14M5 7h14M5 7l-3 8a3 3 0 006 0zM19 7l-3 8a3 3 0 006 0z"/>',
clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h6"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>',
pen:'<path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/>',
chev:'<path d="M9 6l6 6-6 6"/>',net:'<circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5l-6 5.5M12 11.5l6 5.5"/>'};
const svg=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24">${P[n]}</svg>`;
const CYC=["folder","clip","file","cap"];
const mk=(id,t,icon)=>({id,title:t,notes:"",icon,children:[],cases:[]});
const starter=()=>({branches:[mk("residency","Residency","pin"),mk("dual-enrollment","Dual Enrollment","users"),mk("sb554","SB554","file"),mk("academic-renewal","Academic Renewal","archive"),mk("ap","AP","cap"),mk("map","MAP","folder"),mk("subpoenas","Subpoenas","scale"),mk("transcripts","Transcripts","clip")]});

let D,view=matchMedia("(max-width:640px)").matches?"list":"map",activeId=null,caseForm=null,undo=null,quiet=false;
try{D=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!D||!Array.isArray(D.branches))D=starter();
D.prefs??={theme:"auto",big:false};D.created??=Date.now();
const save=()=>{if(!quiet)clearUndo(true);try{localStorage.setItem(KEY,JSON.stringify(D))}catch{alert("Couldn't save to this browser. Use Export backup to keep your data.")}diskSoon()};
try{navigator.storage?.persist?.()}catch{}

const $=s=>document.querySelector(s),app=$("#app"),dlg=$("#dlg");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LINK=/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|(?:https?:\/\/|www\.)(?:(?!&(?:quot|#39|lt|gt);)[^\s<])+/gi;
const linkify=t=>esc(t).replace(LINK,(m,lab,url)=>{
  if(lab)return `<a href="${url}" target="_blank" rel="noopener noreferrer">${lab}</a>`;
  const tail=(m.match(/[.,;:!?)\]]+$/)||[""])[0],u=tail?m.slice(0,-tail.length):m;
  return `<a href="${u.startsWith("www.")?"https://"+u:u}" target="_blank" rel="noopener noreferrer">${u}</a>${tail}`;
});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pl=(n,w)=>`${n} ${w}${n==1?"":"s"}`;
const sub=n=>n==1?"1 sub-branch":`${n} sub-branches`;
const find=(a,id)=>{for(const n of a){if(n.id==id)return n;const f=find(n.children,id);if(f)return f}return null};
const pathTo=(a,id,p=[])=>{for(const n of a){const q=[...p,n];if(n.id==id)return q;const f=pathTo(n.children,id,q);if(f.length)return f}return[]};
const strip=(a,id)=>a.filter(n=>n.id!=id).forEach(n=>n.children=strip(n.children,id))||a.filter(n=>n.id!=id);
const remove=id=>{const rec=a=>a.filter(n=>n.id!=id).map(n=>({...n,children:rec(n.children)}));D.branches=rec(D.branches)};
const cnt=n=>n.cases.length+n.children.reduce((s,c)=>s+cnt(c),0);
const flat=(a,anc=[])=>a.flatMap(n=>{const p=[...anc,n.title];return[{n,p},...flat(n.children,p)]});
const icon=n=>n.icon&&P[n.icon]?n.icon:"folder";
$("#logo").innerHTML=svg("net",20);

/* image storage (IndexedDB, blobs stay out of localStorage) */
const DB=new Promise((res,rej)=>{const r=indexedDB.open("work-brain-img",1);r.onupgradeneeded=()=>r.result.createObjectStore("i");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idb=(mode,fn)=>DB.then(db=>new Promise((res,rej)=>{const t=db.transaction("i",mode);const r=fn(t.objectStore("i"));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)}));

let dir=null,diskT=null,writing=false,again=false;const onDisk=new Set(),disk={state:"none",last:0,err:""};
const clearImgs=async()=>{const ks=await idb("readonly",s=>s.getAllKeys());for(const k of ks)if(k!="__fh")await delImg(k)};

function updDisk(){
  const b=$("#diskBtn");if(!b)return;b.hidden=!window.showDirectoryPicker;
  const L={none:"Auto-save to folder",ok:disk.last?"Saved "+new Date(disk.last).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"Auto-save on",perm:"Reconnect folder",hold:"Review folder data",error:"Folder error"}[disk.state];
  b.innerHTML=svg("folder",14)+" "+esc(L);b.title=disk.state=="error"?disk.err:"Automatically save your data to a folder on your computer";

async function loadOnDisk(){onDisk.clear();try{const d=await dir.getDirectoryHandle("images");for await(const[n]of d.entries())onDisk.add(n.replace(/\.jpg$/,""))}catch{}}
async function readDisk(){try{return JSON.parse(await(await(await dir.getFileHandle("work-brain-data.json")).getFile()).text())}catch{return null}}
async function writeDisk(){
  if(!dir||disk.state!="ok")return;
  if(writing){again=true;return}
  writing=true;
  try{
    const want=new Set(allImgIds());
    if(want.size||onDisk.size){
      const idir=await dir.getDirectoryHandle("images",{create:true});
      for(const id of want)if(!onDisk.has(id)){const b=await getImg(id);if(b){const w=await(await idir.getFileHandle(id+".jpg",{create:true})).createWritable();await w.write(b);await w.close();onDisk.add(id)}}
      for(const id of[...onDisk])if(!want.has(id)){await idir.removeEntry(id+".jpg").catch(()=>{});onDisk.delete(id)}
    }
    const stamp=Date.now();D.diskStamp=stamp;
    const w=await(await dir.getFileHandle("work-brain-data.json",{create:true})).createWritable();await w.write(JSON.stringify({...D,_savedAt:stamp}));await w.close();
    disk.last=stamp;disk.err="";try{localStorage.setItem(KEY,JSON.stringify(D))}catch{}
  }catch(e){disk.state=(e?.name=="NotAllowedError"||e?.name=="SecurityError")?"perm":"error";disk.err=e?.message||"Couldn’t write to the folder."}
  writing=false;updDisk();if(again){again=false;diskSoon()}
}
async function loadFromDisk(j){
  try{const idir=await dir.getDirectoryHandle("images");for await(const[n,h]of idir.entries()){const id=n.replace(/\.jpg$/,"");if(h.kind=="file"&&!(await getImg(id)))await putImg(id,await h.getFile())}}catch{}
  const stamp=j._savedAt;delete j._savedAt;D=j;D.diskStamp=stamp;D.prefs??={theme:"auto",big:false};D.created??=Date.now();
  migrate();norm(D.branches);applyPrefs();activeId=null;caseForm=null;
  disk.state="ok";disk.last=stamp;try{localStorage.setItem(KEY,JSON.stringify(D))}catch{}
  await loadOnDisk();render();updDisk();
}

  if(r.repeat=="weekly"){const w=dow(r.date);let d=addDays(t,1);while(dow(d)!=w)d=addDays(d,1);return d}

  "log-add"(){const el=$("#lt"),v=el.value.trim();if(!v){el.focus();return}cur().tasks.push({id:uid(),text:v,due:"",done:true,doneAt:$("#ld").value||today()});touch();setTimeout(()=>$("#lt")?.focus())},
  "log-all"(){logAll=!logAll;touch()},
  capture(){
    syncForm();
    const opts=flat(D.branches).map(({n,p})=>`<option value="${n.id}">${esc(p.join(" › "))}</option>`).join("");
    ask(`<h2>Quick capture</h2><label>Title <span style="font-weight:400;color:var(--mut)">(optional)</span><input name="h" autofocus placeholder="Name it now, or leave blank to name it later"></label><label>Your note<textarea name="t" rows="5"></textarea></label><label>Save to<select name="b"><option value="">New branch</option>${opts}</select></label><div class="row end"><button value="cancel" class="btn ghost" formnovalidate>Cancel</button><button value="ok" class="btn">Save</button></div>`,f=>{
      const t=f.elements.t.value.trim(),h=f.elements.h.value.trim(),b=f.elements.b.value;if(!t&&!h)return;
      if(!b){const c=untitled(t,h);D.branches.push(c);save();render();toast(h?"Saved as a new branch.":"Saved to a new untitled branch.",c.id)}
      else{const n=find(D.branches,b);n.cases.push({id:uid(),title:h||t.split("\n")[0].slice(0,70),details:t,outcome:"",images:[],created:new Date().toLocaleDateString()});save();render();toast("Saved as a note in “"+n.title+"”.",n.id)}
    });
  },
  zoom(_,t){const im=t.querySelector("img");if(!im?.src)return;dlg.innerHTML=`<form method="dialog" style="padding:10px;text-align:center"><img src="${im.src}" alt="" style="max-width:100%;max-height:78vh;border-radius:8px"><div class="row end" style="margin-top:8px"><button class="btn ghost sm">Close</button></div></form>`;dlg.style.width="min(900px,calc(100vw - 32px))";dlg.onclose=null;dlg.showModal()},
  "pick-img"(){syncForm();$("#imgs").click()},
  "img-rm"(id){syncForm();if(caseForm.added.includes(id)){delImg(id);caseForm.added=caseForm.added.filter(i=>i!=id)}else caseForm.removed.push(id);caseForm.images=caseForm.images.filter(i=>i!=id);render()},
  "note-new"(){caseForm={title:"",details:"",outcome:"",images:[],added:[],removed:[]};render()},
  "note-edit"(id){const c=find(D.branches,activeId).cases.find(c=>c.id==id);caseForm={...c,images:[...(c.images||[])],added:[],removed:[]};render()},
  "note-cancel"(){dropForm();render()},
  "note-save"(){
    const title=$("#ct").value.trim();if(!title){$("#ct").focus();return}
    const n=find(D.branches,activeId),item={id:caseForm.id||uid(),title,details:$("#cd").value.trim(),outcome:$("#co").value.trim(),created:caseForm.created||new Date().toLocaleDateString(),pinned:!!caseForm.pinned};
    item.images=[...caseForm.images];caseForm.removed.forEach(delImg);n.cases=caseForm.id?n.cases.map(c=>c.id==item.id?item:c):[...n.cases,item];openNotes.add(item.id);caseForm=null;save();render();
  },
  "note-del"(id){const n=cur(),c=n.cases.find(c=>c.id==id);withUndo("Note deleted.",()=>{n.cases=n.cases.filter(c=>c.id!=id)},c.images||[])},
  async export(){
    D.lastBackup=Date.now();save();const images={};for(const id of allImgIds()){try{const b=await getImg(id);if(b)images[id]=await b2d(b)}catch{}}
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({...D,images})],{type:"application/json"}));
    a.download=`work-brain-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },
};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(t){if(t.dataset.act!="menu")document.querySelector(".tools")?.classList.remove("open");A[t.dataset.act]?.(t.dataset.id,t);return}
  if(!e.target.closest(".sw"))hideRes();
});
$("#file").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const j=JSON.parse(await f.text());if(j&&j.wb_share){await importShared(j);return}if(!Array.isArray(j.branches))throw 0;
    if(!confirm("Replace everything currently stored with this backup?"))return;
    await clearImgs();for(const[id,u]of Object.entries(j.images||{}))await putImg(id,d2b(u));delete j.images;D=j;migrate();D.prefs??={theme:"auto",big:false};D.created??=Date.now();applyPrefs();activeId=null;caseForm=null;save();render();
  }catch{alert("That file isn't a valid Work Brain backup.")}
});

/* search */
const hideRes=()=>{$("#res").style.display="none"};
const hl=(t,q)=>{t=String(t??"");const l=t.toLowerCase();let o="",i=0,k;while((k=l.indexOf(q,i))>=0){o+=esc(t.slice(i,k))+"<mark>"+esc(t.slice(k,k+q.length))+"</mark>";i=k+q.length}return o+esc(t.slice(i))};
const snip=(t,q)=>{t=t.replace(/\s+/g," ");const k=Math.max(0,t.toLowerCase().indexOf(q)-30);return(k>0?"…":"")+t.slice(k,k+90)+(t.length>k+90?"…":"")};
function searchAll(q){
  const out=[],has=x=>String(x||"").toLowerCase().includes(q);
  for(const{n,p}of flat(D.branches)){
    const path=p.join(" › "),up=p.slice(0,-1).join(" › ")||"Top level";
    if(has(n.title)||has(n.notes))out.push({type:"Branch",rank:has(n.title)?0:1,id:n.id,title:n.title,path:up,sn:has(n.title)?"":n.notes});
    for(const c of n.cases)if(has(c.title)||has(c.details)||has(c.outcome))out.push({type:"Note",rank:has(c.title)?2:3,id:n.id,note:c.id,title:c.title,path,sn:has(c.title)?"":(has(c.details)?c.details:c.outcome)});
    for(const t of n.tasks)if(has(t.text))out.push({type:t.done?"Done":"To-do",rank:4,id:n.id,title:t.text,path,sn:""});
  }
  return out.sort((a,b)=>a.rank-b.rank).slice(0,40);
}
$("#q").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase(),r=$("#res");
  if(!q){hideRes();return}
  const hits=searchAll(q);
  r.innerHTML=hits.length?hits.map(h=>`<button data-act="open" data-id="${h.id}"${h.note?` data-note="${h.note}"`:""}><span class="tag">${h.type}</span><b style="color:var(--ink)">${hl(h.title,q)}</b><br><small>${esc(h.path)}</small>${h.sn?`<small class="sn">${hl(snip(h.sn,q),q)}</small>`:""}</button>`).join(""):`<p class="mut" style="padding:14px;text-align:center">Nothing matches “${esc(e.target.value)}”.</p>`;
  r.style.display="block";
});
$("#imgs").addEventListener("change",e=>{const f=[...e.target.files];e.target.value="";addImages(f)});
document.addEventListener("paste",e=>{if(!caseForm)return;const f=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith("image/")).map(i=>i.getAsFile());if(f.length){e.preventDefault();addImages(f)}});
document.addEventListener("keydown",e=>{const a=e.target.dataset?.enter;if(a&&e.key=="Enter"){e.preventDefault();A[a](e.target.dataset.id,e.target)}});
document.addEventListener("dragstart",e=>{const el=e.target.closest?.("[data-drag]");if(!el)return;dragId=el.dataset.drag;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",dragId);el.classList.add("dragging")});
document.addEventListener("dragover",e=>{const t=dragId&&e.target.closest?.("[data-drag]");if(t&&t.dataset.drag!=dragId){e.preventDefault();document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));t.classList.add("over")}});
document.addEventListener("drop",e=>{const t=dragId&&e.target.closest?.("[data-drag]");if(t){e.preventDefault();const id=dragId;dragId=null;moveTo(id,t.dataset.drag)}});
document.addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".over,.dragging").forEach(x=>x.classList.remove("over","dragging"))});
window.addEventListener("afterprint",()=>{if(printing){printing=false;render()}});
document.addEventListener("keydown",e=>{
  const el=e.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)||el.isContentEditable;
  if(e.altKey&&e.key.startsWith("Arrow")&&el.dataset?.act=="open"){
    e.preventDefault();const id=el.dataset.id,a=siblings(id),i=a.findIndex(n=>n.id==id),j=/Left|Up/.test(e.key)?i-1:i+1;
    if(a[j]){moveTo(id,a[j].id);setTimeout(()=>document.querySelector(`[data-act="open"][data-id="${id}"]`)?.focus())}return;
  }
  if(e.key=="Escape"&&el.id=="q"){el.value="";hideRes();el.blur();return}
  if(typing||dlg.open||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key=="/"){e.preventDefault();$("#q").focus()}
  else if(e.key=="n"){e.preventDefault();A.capture()}
  else if(e.key=="?")A.help();
  else if(e.key=="Escape"&&activeId&&!caseForm){const p=pathTo(D.branches,activeId),par=p[p.length-2];par?A.open(par.id):A.home()}
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyPrefs);
migrate();norm(D.branches);applyPrefs();
window.addEventListener("storage",e=>{if(e.key!=KEY||!e.newValue)return;try{syncForm();clearUndo(true);D=JSON.parse(e.newValue);D.prefs??={theme:"auto",big:false};norm(D.branches);applyPrefs();render()}catch{}});
render();initDisk();initReminders();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
idb("readonly",s=>s.getAllKeys()).then(keys=>{const used=new Set(allImgIds());keys.filter(k=>k!="__fh"&&!used.has(k)).forEach(delImg)}).catch(()=>{});
</script>
